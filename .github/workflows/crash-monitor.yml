name: crash-monitor

on:
  schedule:
    - cron: "0 22 * * 0-4"   # UTC 22:00 = 日本時間 月〜金 朝7:00
  workflow_dispatch: {}        # 手動実行ボタン

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scikit-learn
      - run: python -u main.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: 公開用に配置して保存
        run: |
          mkdir -p docs
          cp output/crash_report.html docs/index.html
          git config user.name "crash-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add output docs
          git diff --cached --quiet || git commit -m "update $(date -u +%F)"
          git push
